name: Daily forecast

on:
  schedule:
    - cron: "17 7 * * *"   # every day 07:17 UTC = 10:17 Istanbul (before the day-ahead market closes)
  workflow_dispatch:         # allows a manual run from the Actions tab

permissions:
  contents: write            # needed to commit forecasts/forecasts.csv back to the repo

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Forecast tomorrow
        env:
          EPTR_USERNAME: ${{ secrets.EPTR_USERNAME }}
          EPTR_PASSWORD: ${{ secrets.EPTR_PASSWORD }}
        run: python src/predict.py

      - name: Commit forecast
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add forecasts/forecasts.csv
          git commit -m "Daily forecast $(date -u +%Y-%m-%d)" || echo "No changes"
          git push
